[project]
name = "invesit"
version = "0.1.0"
description = "Educational assistant for Tunisian savers: the AI talks, the calculator counts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C90", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers --cov=backend --cov-report=term-missing"
markers = [
    "db: needs a running Postgres (skipped when unavailable)",
    "llm: needs a real LLM provider (skipped by default)",
]

[tool.coverage.run]
branch = true
omit = ["backend/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
